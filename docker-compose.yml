# Desarrollo: "docker compose up -d db" levanta solo la base.
# Servidor:   "docker compose up -d --build" levanta base, API y web.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    # Solo accesible desde el propio servidor; la API se conecta por la red interna.
    ports:
      - "127.0.0.1:${DB_PORT:-5440}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Notificaciones push. Sin estas claves la app funciona igual, sin notificaciones.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://emparejados.onlineturnos.ar}
      PORT: "4000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_DEMO: ${NEXT_PUBLIC_DEMO:-}
    restart: unless-stopped
    depends_on:
      - api
    # El túnel de Cloudflare apunta a este puerto; no se expone a internet.
    ports:
      - "127.0.0.1:${WEB_PORT:-8084}:3000"

volumes:
  db_data:
